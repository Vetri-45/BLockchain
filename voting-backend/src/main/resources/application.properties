# ?? Mail ??????????????????????????????????????????????????????
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${SPRING_MAIL_USERNAME:YOUR_MAILTRAP_USERNAME}
